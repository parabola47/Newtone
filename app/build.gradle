apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.parabola.newtone'

    compileSdkVersion 33

    defaultConfig {
        applicationId "com.parabola.newtone"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 37
        versionName "1.0.12"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-debug.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        lintConfig file('../app/lint.xml')
    }
}

dependencies {
    implementation project(path: ':domain')
    implementation project(path: ':data')
    implementation project(path: ':player_feature')
    implementation project(path: ':sleep_timer_feature')
    implementation project(path: ':search_feature')
    implementation project(path: ':Slidr')      //  Swipe to back support

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation(
            libs.androidx.appcompat,
            libs.androidx.constraintlayout,
            libs.androidx.legacy.support,
            libs.androidx.multidex,
            libs.android.material,
            libs.androidx.core.ktx,
            libs.kotlin.stdlib,
    )
    coreLibraryDesugaring(libs.android.desugar.jdk)


    //Firebase
    implementation(
            platform(libs.firebase.bom),
            libs.firebase.analytics,
            libs.firebase.crashlytics,
            libs.firebase.perf,
    )


    //    DAGGER
    implementation(
            libs.dagger.android,
            libs.dagger.android.support,
    )
    // for use the support libraries
    annotationProcessor(
            libs.dagger.android.processor,
            libs.dagger.android.compiler,
    )
    kapt(libs.dagger.android.compiler)


    //    MOXY
    implementation(
            libs.moxy,
            libs.moxy.androidx,
    )
    annotationProcessor(libs.moxy.compiler)
    kapt(libs.moxy.compiler) // можно будет убрать после полного переноса на kotlin


    implementation(
            libs.fastScrollRecyclerView,
            libs.rxAndroid,
            libs.slidingUpPanel,
            libs.verticalseekbar,
    )
}
